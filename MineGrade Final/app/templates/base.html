<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %}</title>
  {% block css %}{% endblock %}
  <style>
    /* --- Global Styles & Fonts --- */
    @font-face {
      font-family: "Minecraft";
      src: url("{{ url_for('static', filename='Minecraft.ttf') }}") format("truetype");
      /* Ensure this file is inside your static/ folder */
    }

    body {
      margin: 0;
      font-family: "Minecraft", Arial, sans-serif;
      background: #181818;
      /* Main Dashboard Dark Background */
      color: #ffffff;
      image-rendering: pixelated;
      /* Keeps custom pixel art crisp */
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* --- Sidebar with Dark Green Aesthetics --- */
    .sidebar {
      width: 240px;
      background: #2f5226;
      /* Sidebar Forest Green background from screenshot */
      border-right: 6px solid #233414;
      /* Darker green border */
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container .uni-logo {
      width: 130px;
      height: auto;
      margin-bottom: 40px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
    }

    .sidebar li {
      color: #bcbcbc;
      font-size: 20px;
      padding: 12px 14px;
      margin: 8px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      /* Space between the image and the text label */
      text-shadow: 2px 2px #000;
      box-sizing: border-box;
      border: 3px solid transparent;
      /* Keeps items from jumping when active hover applies */
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: white;
    }

    .sidebar li:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .sidebar li.active {
      background: #233414;
      /* Active item dark olive block background */
      border: 3px solid #7ccd56;
      /* Accurate vibrant green select box border */
      color: #fff;
    }

    /* --- Sharp Pixel-Art Icons for Navigation --- */
    .sidebar-icon {
      width: 40px;
      height: 40px;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* --- Main Layout --- */
    .main {
      flex: 1;
      padding: 40px;
      background: #181818; /* Dark UI backdrop */
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Sidebar Navigation -->
    <div class="sidebar">
      <div class="logo-container">
        <img src="{{ url_for('static', filename='image/asia_uni_icon.png') }}" alt="Asia University" class="uni-logo" />
      </div>
      <ul class="nav-menu">
        <li class="{{ 'active' if request.path == '/dashboard' else '' }}">
          <a href="/dashboard" class="nav-link">
            <img src="{{ url_for('static', filename='image/craftingtable.jpg') }}" alt="Dashboard Icon" class="sidebar-icon" />
            Dashboard
          </a>
        </li>
        <li class="{{ 'active' if request.path == '/course' else '' }}">
          <a href="/course" class="nav-link">
            <img src="{{ url_for('static', filename='image/booksheves.jpg') }}" alt="Course Icon" class="sidebar-icon" />
            Course
          </a>
        </li>
        <li class="{{ 'active' if request.path == '/predict' else '' }}">
          <a href="/predict" class="nav-link">
            <img src="{{ url_for('static', filename='image/luckyblock.jpg') }}" alt="Prediction Icon" class="sidebar-icon" />
            Prediction
          </a>
        </li>
        <li class="{{ 'active' if request.path == '/profile' else '' }}">
          <a href="/profile" class="nav-link">
            <img src="{{ url_for('static', filename='image/stevehead.jpg') }}" alt="Profile Icon" class="sidebar-icon" />
            Profile
          </a>
        </li>
      </ul>
    </div>
    <div class="main">
      {% block main %}{% endblock %}
    </div>
  </div>
</body>
<script>
    function updateClock() {
        const timeElement = document.getElementById('current-time');
        if (timeElement) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            timeElement.textContent = `${hours}:${minutes}:${seconds}`;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateClock();
        setInterval(updateClock, 1000);
    });
</script>
</html>
