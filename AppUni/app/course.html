        :root {
            --bg-dark: #121212;
            --bg-sidebar: #2e4c1e;
            --bg-card: #3b5e2b;
            --bg-content: #1e1e1e;
            --text-green: #4eff4e;
            --text-white: #e0e0e0;
            --border-gray: #444444;
            --mc-shadow: #1c3113;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Minecraftia', 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-size: 12px;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            border-right: 4px solid var(--mc-shadow);
        }

        .logo-container {
            padding: 20px;
            display: flex;
            justify-content: center;
            margin-bottom: 40px;
        }

        .logo-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--mc-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            font-weight: bold;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            user-select: none;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background-color: #243d17;
            border: 2px solid var(--text-green);
        }

        .nav-icon {
            font-size: 22px;
            margin-right: 15px;
            width: 60px;
            text-align: center;
            display: inline-block;
        }

        .main-content {
            flex: 1;
            background-color: var(--bg-content);
            padding: 40px;
            overflow-y: auto;
        }

        .page-title {
            color: var(--text-green);
            font-size: 32px;
            margin-bottom: 35px;
            text-shadow: 3px 3px #000;
            font-weight: normal;
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 45px;
        }

        .card {
            background-color: var(--bg-card);
            border: 3px solid #54843f;
            border-bottom-color: #243d17;
            border-right-color: #243d17;
            padding: 24px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            box-shadow: inset -3px -3px 0px var(--mc-shadow);
        }

        .card-icon {
            font-size: 36px;
            margin-bottom: 15px;
            height: 65px;
            width: 65px;
        }

        .card-title {
            font-size: 13px;
            text-shadow: 2px 2px #000;
        }

        .grade-box {
            border: 2px solid var(--text-white);
            padding: 0 5px;
            color: #ffaa00;
            margin-left: 4px;
            display: inline-block;
        }

        .subject-row {
            background-color: #171717;
            border: 2px solid var(--border-gray);
            padding: 24px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .subject-box {
            display: flex;
            flex-direction: column;
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 13px;
            text-shadow: 1px 1px #000;
        }

        .pred-text {
            color: #aaaaaa;
        }

        .progress-bar-container {
            width: 100%;
            height: 16px;
            background-color: #313131;
            border: 2px solid #555555;
            box-shadow: inset 2px 2px 0px #000;
            padding: 1px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            box-shadow: inset 0px 2px 0px rgba(255,255,255,0.25);
            transition: width 0.8s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        .grade-aplus { color: #55ff55; }
        .grade-a     { color: #55ff55; }
        .grade-b     { color: #55ffff; }
        .grade-c     { color: #ffaa00; }
        .grade-d     { color: #ff5555; }
        .grade-f     { color: #aa0000; }

        .bg-aplus { background-color: #55ff55; }
        .bg-a     { background-color: #33cc33; }
        .bg-b     { background-color: #00aaaa; }
        .bg-c     { background-color: #ffaa00; }
        .bg-d     { background-color: #ff5555; }
        .bg-f     { background-color: #aa0000; }

    </style>
</head>
<body>


    <nav class="sidebar">
        <div class="logo-container">
            <img src="img/asia_uni_icon.png" alt="Logo" class="logo-placeholder">
        </div>
        
        <div class="nav-item">
            <img src="img/crafting_table.webp" alt="Dashboard Icon" class="nav-icon">
            <div>Dashboard</div>
        </div>
        <div class="nav-item active">
            <img src="img/bookshelf.webp" alt="Course Icon" class="nav-icon">
            <div>Course</div>
        </div>
        <div class="nav-item">
            <img src="img/lucky_block.webp" alt="Prediction Icon" class="nav-icon">
            <div>Prediction</div>
        </div>
        <div class="nav-item">
            <img src="img/steve_head.jpg" alt="Profile Icon" class="nav-icon">
            <div>Profile</div>
        </div>
    </nav>


    <main class="main-content">

        <h1 class="page-title">Courses</h1>
        <section class="top-grid">
            <div class="card">
                <img src="img/enchanted_book.webp" alt="Grade Icon" class="card-icon">
                <div class="card-title">Grade <span class="grade-box">#func.</span></div>
            </div>
            <div class="card">
                <img src="img/clock.gif" alt="Time Icon" class="card-icon">
                <span class="card-title">Time <span id="current-time" class="time-value">--:--</span></span>
            </div>
            <div class="card">
                <img src="img/enchanted_diamond_pick.gif" alt="Achievement Icon" class="card-icon">
                <div class="card-title">Achievements</div>
            </div>
            <div class="card">
                <img src="img/ender_eye.png" alt="GPA Icon" class="card-icon">
                <div class="card-title">GPA</div>
            </div>
        </section>


        <section class="subjects-container">
            <div class="subject-row">
                <div class="subject-box">
                    <div class="subject-header">
                        <span>SE 101</span>
                        <span class="pred-text">Grade <span class="grade-aplus">#func.</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-fill bg-aplus" data-progress="50%"></div>
                    </div>
                </div>
                <div class="subject-box">
                    <div class="subject-header">
                        <span>SB 500</span>
                        <span class="pred-text">Grade <span class="grade-b">#func.</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-fill bg-b" data-progress="50%"></div>
                    </div>
                </div>
                <div class="subject-box">
                    <div class="subject-header">
                        <span>ECD 21</span>
                        <span class="pred-text">Grade <span class="grade-d">#func.</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-fill bg-d" data-progress="50%"></div>
                    </div>
                </div>
            </div>


            <div class="subject-row">
                <div class="subject-box">
                    <div class="subject-header">
                        <span>SB 751</span>
                        <span class="pred-text">Grade <span class="grade-a">#func.</span></span>
                    </div>
		            <div class="progress-bar-container">
                        <div class="progress-fill bg-a" data-progress="50%"></div>
                    </div>
                </div>
                <div class="subject-box">
                    <div class="subject-header">
                        <span>CA 102</span>
                        <span class="pred-text">Grade <span class="grade-c">#func.</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-fill bg-c" data-progress="50%"></div>
                    </div>
                </div>
                <div class="subject-box">
                    <div class="subject-header">
                        <span>CA 103</span>
                        <span class="pred-text">Grade <span class="grade-f">#func.</span></span>
                    </div>
                    <div class="progress-bar-container">
                        <div class="progress-fill bg-f" data-progress="50%"></div>
                    </div>
                </div>
            </div>
        </section>
    
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressFills = document.querySelectorAll('.progress-fill');
            setTimeout(() => {
                progressFills.forEach(bar => {
                    const targetProgress = bar.getAttribute('data-progress');
                    bar.style.width = targetProgress;
                });
            }, 250);
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                });
            });
        });


        function liveSystemClockUpdate() {
            const currentSystemDate = new Date();
            let hours = currentSystemDate.getHours();
            let minutes = currentSystemDate.getMinutes();
            if (minutes < 10) { minutes = "0" + minutes; }
            if (hours < 10) { hours = "0" + hours; }
            const timeTargetBlock = document.getElementById('current-time');
            if (timeTargetBlock) {
                timeTargetBlock.textContent = hours + ":" + minutes;
            }
        }
        liveSystemClockUpdate();
        setInterval(liveSystemClockUpdate, 1000);


        function grader(score) {
            if (score >= 90) {
                return "A+";
            } else if (score >= 80) {
                return "A";
            } else if (score >= 70) {
                return "B";
            } else if (score >= 60) {
                return "C";
            } else if (score >= 50) {
                return "D";
            } else {
                return "F";
            }
        }
        console.log(grader(65));
        console.log(grader(92));
    </script>
</body>
</html>
