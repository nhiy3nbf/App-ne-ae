<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniversityCraft Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
    .stat-card{
    position:relative;
    padding:20px;
}

.stat-top{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.mc-icon{
    width:22px;
    image-rendering:pixelated;
}

.stat-number{
    margin-top:20px;
    font-size:36px;
    text-align:center;
}
.logo-container{
    text-align:center;
    margin-bottom:25px;
}

.university-logo{
    width:140px;
    height:auto;
    display:block;
    margin:auto;
}

.logo{
    color:white;
    font-size:12px;
    margin-top:10px;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Press Start 2P', cursive;
    background:#1e1e1e;
    color:white;
}

.container{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#3b5d2a;
    border-right:6px solid #2a411e;
    padding:20px;
}

.logo{
    text-align:center;
    margin-bottom:40px;
    color:#ffe600;
}

.nav-item{
    background:#4c7a35;
    padding:15px;
    margin-bottom:12px;
    cursor:pointer;
    border:3px solid #2a411e;
    transition:0.2s;
}

.nav-item:hover{
    transform:translateY(-2px);
    background:#5d9142;
}

/* MAIN */

.main{
    flex:1;
    padding:30px;
}

/* PROFILE */

.profile-card{
    background:#2d2d2d;
    border:4px solid #777;
    padding:25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:25px;
}

.profile-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.avatar{
    width:100px;
    height:100px;
    border:4px solid #fff;
    object-fit:cover;
}

.profile-info h2{
    margin-bottom:15px;
    font-size:18px;
}

.profile-info p{
    margin-bottom:10px;
    font-size:12px;
}

.customize-btn{
    background:#4CAF50;
    color:white;
    border:none;
    padding:12px;
    cursor:pointer;
    font-family:inherit;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:25px;
}

.stat-card{
    background:#4c7a35;
    border:4px solid #2a411e;
    padding:20px;
    text-align:center;
}

.stat-card h3{
    font-size:12px;
    margin-bottom:15px;
}

.stat-card p{
    font-size:20px;
}

/* CONTENT */

.content-grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

/* COURSES */

.courses{
    background:#2d2d2d;
    padding:20px;
    border:4px solid #777;
}

.section-title{
    margin-bottom:20px;
    color:#ffe600;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.course-card{
    background:#4c7a35;
    border:3px solid #2a411e;
    padding:15px;
}

.course-card h4{
    margin-bottom:10px;
    font-size:12px;
}

.course-card p{
    font-size:10px;
}

/* REMINDERS */

.reminders{
    background:#2d2d2d;
    padding:20px;
    border:4px solid #777;
}

.reminder-item{
    background:#795548;
    margin-bottom:10px;
    padding:12px;
    border:2px solid #4e342e;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
}

.modal-content{
    background:#2d2d2d;
    padding:30px;
    width:500px;
    border:5px solid #777;
}

.modal-content h2{
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:10px;
}

.input-group input{
    width:100%;
    padding:10px;
}

.save-btn{
    width:100%;
    padding:12px;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    font-family:inherit;
}

@media(max-width:900px){

.stats{
    grid-template-columns:repeat(2,1fr);
}

.content-grid{
    grid-template-columns:1fr;
}

.sidebar{
    display:none;
}

}

</style>
</head>

        <div class="content-grid">

                <div id="reminderList"></div>

        </div>

    </div>

</div>

<div class="modal" id="modal">

        <button class="save-btn" onclick="saveProfile()">
            Save

</div>
